[build]
# Explicitly declare no build-time secrets are required.
# R2 credentials (R2_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET)
# are runtime environment variables only — they are read at startup via
# os.getenv() in routers/documentos.py, not during the image build.
secrets = []

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"

[deploy]
preDeployCommand = "python migrate_once.py"
# migrate_once corre UNA vez, antes de los workers: create_all y, si hace
# falta, alembic stamp/upgrade con un candado. No se llama Alembic dentro de
# uvicorn: cada worker abría su conexión y se bloqueaban entre sí.
startCommand = "if [ \"$RAILWAY_SERVICE_NAME\" = \"bbc-daily\" ]; then python run_daily.py; elif [ \"$RAILWAY_SERVICE_NAME\" = \"bbc-monthly\" ]; then python run_monthly.py; else uvicorn main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1} --loop uvloop --log-config log_config.json; fi"
healthcheckPath = "/health"
healthcheckTimeout = 60
region = "us-east4"

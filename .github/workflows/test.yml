name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-only-for-ci
        run: pytest tests/ -x -q --tb=short

  # El job de arriba corre sobre SQLite, que NO ejerce las ramas `if "postgresql"
  # in db_url`. Un bug que rompia toda la facturacion (pg_advisory_xact_lock con
  # firma inexistente) paso 97 tests en verde porque esa rama solo corre contra
  # Postgres. Este job cierra ese hueco usando el mismo motor que produccion.
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbcfile_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run tests against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bbcfile_test
          SECRET_KEY: test-secret-key-only-for-ci
          # documentos.py valida el storage en tiempo de import cuando la URL es
          # postgresql, asi que sin estas variables el import falla antes de correr.
          STORAGE_ENDPOINT: https://ci.invalido
          STORAGE_BUCKET: ci-bucket
          STORAGE_KEY: ci-key
          STORAGE_SECRET: ci-secret
        run: pytest tests/ -x -q --tb=short

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm run build

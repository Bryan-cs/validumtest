<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>BBC File — Gestión de Personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-primary: #4F46E5; --c-accent: #F59E0B;
      --c-green: #16A34A;   --c-green-bg: #DCFCE7;
      --c-red: #DC2626;     --c-red-bg: #FEE2E2;
      --c-amber: #D97706;   --c-amber-bg: #FEF3C7;
      --c-blue: #3B82F6;    --c-blue-bg: #EFF6FF;
      --c-text: #1E293B;    --c-text2: #64748B;
      --c-border: #E2E8F0;
      --c-surface: #FFFFFF; --c-surface2: #F8F9FF; --c-bg: #F0F2FF;
    }
    .dark {
      --c-primary: #818CF8; --c-accent: #FBBF24;
      --c-green: #4ADE80;   --c-green-bg: #052E16;
      --c-red: #FC8585;     --c-red-bg: #3B0D0D;
      --c-amber: #FBBF24;   --c-amber-bg: #2D1800;
      --c-blue: #60A5FA;    --c-blue-bg: #0D2045;
      --c-text: #E0E8F5;    --c-text2: #8FA3BF;
      --c-border: #2D2B55;
      --c-surface: #1C1938; --c-surface2: #13112A; --c-bg: #0D0B1E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; background: var(--c-bg); color: var(--c-text); transition: background .2s, color .2s; }
    input, select, textarea, button { color: var(--c-text); font-size: 14px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--c-surface2); }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
